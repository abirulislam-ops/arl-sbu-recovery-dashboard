<!DOCTYPE html>

<head>

<style>

    --red:#dc2626; --orange:#ea580c; --amber:#d97706; --green:#16a34a; --gray:#64748b;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 30px -16px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* Layout */

  .sidebar{width:292px;flex:none;background:#0b1220;color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.08);transition:width .25s ease}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}

  /* Sidebar brand */
  .side-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.09);flex:none}
  .side-brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;box-shadow:0 6px 18px rgba(99,102,241,.4);flex:none}
  .side-brand .logo svg{width:20px;height:20px}
  .side-title{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .side-sub{font-size:11px;color:#8a97a8;margin-top:2px}

  /* Menu */
  .menu-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:700;padding:14px 18px 6px;flex:none}
  .menu{flex:1;overflow-y:auto;padding:2px 12px 20px}
  .menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#9aa7b6;cursor:pointer;font-size:13px;font-weight:600;transition:.18s;border:none;background:none;width:100%;text-align:left}
  .menu-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .menu-item.active{color:#fff;background:linear-gradient(135deg,#6366f1,#4338ca);box-shadow:0 4px 14px rgba(99,102,241,.35)}
  .menu-item .serial{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#cbd5e1}
  .menu-item.active .serial{background:rgba(255,255,255,.22);color:#fff}
  .menu-item .dot{width:8px;height:8px;border-radius:50%;flex:none;opacity:.9}
  .menu-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu-item .loss{font-size:11px;font-weight:700;color:#f87171;font-variant-numeric:tabular-nums;flex:none}
  .menu-item.active .loss{color:#fff}
  .menu-item .loss.surplus{color:#34d399}

  /* Sidebar collapse */
  .side-brand-txt{flex:1;min-width:0;overflow:hidden}
  .collapse-btn{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#cbd5e1;cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;transition:.18s}
  .collapse-btn:hover{background:rgba(255,255,255,.14);color:#fff}
  .sidebar.collapsed{width:68px}
  .sidebar.collapsed .side-brand{padding:16px 0;justify-content:center}
  .sidebar.collapsed .logo{display:none}
  .sidebar.collapsed .side-brand-txt{display:none}
  .sidebar.collapsed .menu-label{display:none}
  .sidebar.collapsed .menu{padding:2px 8px 20px}
  .sidebar.collapsed .menu-item{justify-content:center;padding:11px 0}
  .sidebar.collapsed .menu-item .nm,
  .sidebar.collapsed .menu-item .loss,
  .sidebar.collapsed .menu-item .dot{display:none}
  .sidebar.collapsed .menu-item .serial{margin:0}

  .pagehead{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;flex:none}
  .pagehead .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .pagehead h1{font-size:20px;margin:2px 0 0;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .pagehead .sub{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:720px}
  .pagehead .hmeta{display:flex;gap:8px;flex-wrap:wrap}
  .pagehead .chip{display:inline-flex;align-items:center;gap:7px;background:var(--line2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
  .pagehead .chip b{color:var(--ink);font-weight:700}
  .pagehead .chip .live{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}

  /* Main content */
  main{flex:1;max-width:1180px;margin:0 auto;padding:24px 28px 40px;width:100%}
  .pane{display:none}
  .pane.active{display:block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head .bar{width:4px;height:18px;background:var(--brand);border-radius:99px}
  .sec-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sec-head p{margin:0;font-size:12px;color:var(--muted2)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}

  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}

  tbody tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .neg{color:var(--red);font-weight:700} .pos{color:var(--green);font-weight:700}
  .nm{font-weight:700} .code{color:var(--muted2);font-size:11px;font-weight:600}

  .sev.medium{color:var(--amber);background:#fef3c7} .sev.low{color:var(--green);background:#dcfce7}
  .sev.none{color:var(--gray);background:#f1f5f9}
  .vbadge{display:inline-flex;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}

  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}

  .problem .hl{font-size:12.5px;font-weight:700;line-height:1.35;margin-bottom:7px}
  .problem ul{margin:0;padding-left:16px}
  .problem li{font-size:12px;margin:4px 0;color:#3f4b5f}
  .metric{display:inline-flex;align-items:baseline;gap:5px;font-size:11px;color:var(--muted2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .metric b{font-size:18px;color:var(--ink);font-weight:800}

  .sbuhd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sbuhd h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sbuhd .g{color:var(--muted2);font-size:12px;margin-top:3px}
  .sbustats{display:flex;gap:10px;flex-wrap:wrap}
  .sbustat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;box-shadow:var(--shadow-sm)}
  .sbustat .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);font-weight:700}
  .sbustat .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .sbustat .v.neg{color:var(--red)}.sbustat .v.pos{color:var(--green)}

  .verdict{border-radius:14px;padding:15px 18px;border:1px solid;border-left-width:4px;margin:16px 0}
  .verdict.bad{background:#fef2f2;border-color:#fecaca;border-left-color:var(--red)}
  .verdict.warn{background:#fffbeb;border-color:#fde68a;border-left-color:var(--amber)}
  .verdict.good{background:#f0fdf4;border-color:#bbf7d0;border-left-color:var(--green)}
  .verdict.info{background:#eff6ff;border-color:#bfdbfe;border-left-color:#3b82f6}
  .verdict h3{margin:0 0 5px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
  .verdict h3 svg{width:16px;height:16px;flex-shrink:0}
  .verdict p{margin:0;font-size:13px;color:#374151}
  .note{font-size:11.5px;color:var(--muted2);margin-top:10px;line-height:1.55}

  .plan{background:var(--line2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:13px;color:#3f4b5f}
  .rec{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--card);margin-top:12px;box-shadow:var(--shadow-sm)}
  .rec .unlock{font-size:13px;font-weight:700;color:#312e81;background:var(--brand-soft);border:1px solid #e0e7ff;border-radius:10px;padding:10px 12px;line-height:1.4;margin-bottom:10px}
  .rec ul{margin:0;padding-left:17px}
  .rec li{font-size:12.5px;margin:5px 0;color:#3f4b5f}

  .chart{margin:8px auto 6px}
  .chart svg{max-width:560px;height:auto;display:block;margin:0 auto}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--muted2);margin-top:6px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg{width:9px;height:9px;border-radius:3px;display:inline-block}

  footer{margin-top:30px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.6;box-shadow:var(--shadow-sm)}
  footer b{color:var(--ink)}
  .foot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 28px}
  .f-item{display:flex;gap:12px;align-items:baseline}
  .f-lbl{flex:none;width:84px;font-weight:700;color:var(--ink);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .f-val{font-size:12px;color:var(--muted)}
  .f-note{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}

  .pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:860px){.pg-grid{grid-template-columns:1fr}}
  .pg-chart h4{margin:0 0 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .gap-head,.gap-row{display:grid;grid-template-columns:170px minmax(110px,1fr) 132px 50px;gap:10px;align-items:center}
  .gap-row{margin:9px 0}
  .gap-head{margin:2px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);font-weight:700}
  .gap-sbu{font-weight:800;font-size:12.5px;line-height:1.25}
  .gap-track{height:22px;background:#fee2e2;border:1px solid #fecaca;border-radius:6px;position:relative;overflow:hidden}
  .gap-fill{height:100%;background:linear-gradient(90deg,#818cf8,#4f46e5);border-radius:5px;min-width:2px}
  .gap-nums{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .gap-cov{text-align:right;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
  .gh-amt,.gh-cov{text-align:right}
  .hint{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .hint svg{width:14px;height:14px}
  .hint:hover{color:var(--brand);border-color:var(--brand)}
  .hint.open{color:#fff;border-color:var(--brand);background:var(--brand)}
  .pg-whys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  @media(max-width:860px){.pg-whys{grid-template-columns:1fr}}
  .why{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--line2)}
  .why .w-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .why .w-nm{font-weight:800;font-size:13px}
  .why .w-cov{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .why p{margin:0;font-size:12px;color:#3f4b5f;line-height:1.5}

  /* timeline + tooltip */
  .mk{cursor:pointer}
  .tip{position:fixed;z-index:99;max-width:320px;background:#0f172a;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 12px 30px rgba(16,24,40,.35);opacity:0;transform:translateY(5px);transition:opacity .14s,transform .14s}
  .tip.show{opacity:1;transform:translateY(0)}
  .tl-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px}
  .tl-legend span{display:inline-flex;align-items:center;gap:6px}
</style>
</head>

const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const f=(v,d=2)=>(v<0?'−':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const lossMakers=SBUS.filter(s=>s.deficit>0);
const TOT={def:n(lossMakers.reduce((a,s)=>a+s.deficit,0).toFixed(2)),loss:n(lossMakers.reduce((a,s)=>a+s.loss,0).toFixed(2)),commit:n(lossMakers.reduce((a,s)=>a+s.commit,0).toFixed(2))};
TOT.cov=TOT.commit/TOT.def*100;
const covOf=s=>s.commit==null?null:(s.commit/s.deficit*100);

function svgTrend(s){
  const w=250,h=122,padL=40,padB=20,padT=18,padR=6;
  const keys=['jul','aug','sep'],labels=['Jul','Aug','Sep'];
  const budgets=keys.map(k=>s.rev[k].b), actuals=keys.map(k=>s.rev[k].a);
  const max=Math.max(...budgets,...actuals,1)*1.12;
  const plotW=w-padL-padR,plotH=h-padT-padB;
  const x=i=>padL+(i+0.5)*(plotW/3);
  const y=v=>padT+plotH*(1-v/max);
  const sv=v=>{const t=v<10?v.toFixed(2):v.toFixed(1);return t.replace(/\.?0+$/,'');};
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Monthly revenue budget vs actual">`;
  for(let i=0;i<=3;i++){const gy=padT+plotH*i/3;g+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#eef2f7"/>`;g+=`<text x="${padL-4}" y="${gy+3}" text-anchor="end" font-size="8" fill="#94a3b8">${(max*(1-i/3)).toFixed(0)} Cr</text>`;}
  const bw=Math.min(20,plotW/3*0.22);
  keys.forEach((k,i)=>{const cx=x(i);
    g+=`<rect x="${cx-bw-2}" y="${y(budgets[i])}" width="${bw}" height="${plotH-(y(budgets[i])-padT)}" fill="#cbd5e1" rx="2"/>`;
    g+=`<rect x="${cx+2}" y="${y(actuals[i])}" width="${bw}" height="${plotH-(y(actuals[i])-padT)}" fill="#0e7490" rx="2"/>`;
    if(budgets[i]>0.01)g+=`<text x="${cx-2-bw/2}" y="${y(budgets[i])-3}" text-anchor="middle" font-size="6.5" fill="#94a3b8">${sv(budgets[i])}</text>`;
    if(actuals[i]>0.01)g+=`<text x="${cx+2+bw/2}" y="${y(actuals[i])-3}" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0e7490">${sv(actuals[i])}</text>`;
    g+=`<text x="${cx}" y="${h-7}" text-anchor="middle" font-size="8" fill="#64748b">${labels[i]}</text>`;});
  g+='</svg>';
  return g;
}

function timelineSVG(){
  const M=['Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun'];
  const x0=34,slot=57,y=94,cx=i=>x0+(i+0.5)*slot;
  const tips={
    ALL:'Logistics – Ex-CHA — breaks even end-Q3 (31 Mar 2027). Earlier than LifeCare only because its Q1 loss is small (0.85 Cr) and the date is aspirational: just 75% of its revenue deficit is funded and recovery is war-dependent. Not healthier than LifeCare.',
    ACEL:'Consumer Electronics — breaks even Apr-2027, but this is the least credible date: only 12% of its 8.24 Cr deficit is funded, so Apr-27 is a hope, not a funded plan. Its Q1 loss (0.96 Cr) is small, which is why break-even looks early.',
    ALCL:'LifeCare – Pharmacy — breaks even latest (Jun-27) NOT because it is worse, but because its loss is the largest (2.39 Cr) and it is recovering it honestly (100% of revenue + a quantified 2.39 Cr EAT recovery).',
    NJL:'Next JobZ — the only loss-maker targeting break-even by 31 Dec (the Q2 deadline), fully funded on BOTH lines (100% revenue + 100% EAT). Still break-even, not profit — its 1.80 Cr loss is a gross-margin problem, not a sales problem.'
  };
  const BE=[{k:'ALL',n:'Logistics – Ex-CHA',m:'break-even Mar-27',i:8,clr:'#fbbf24',up:true},{k:'ACEL',n:'Consumer Electronics',m:'break-even Apr-27',i:9,clr:'#f87171',up:false},{k:'ALCL',n:'LifeCare – Pharmacy',m:'break-even Jun-27',i:11,clr:'#34d399',up:true},{k:'NJL',n:'Next JobZ',m:'break-even 31 Dec',i:5.5,clr:'#3b82f6',up:false}];
  let s='<svg viewBox="0 0 800 192" width="100%" height="auto" role="img" aria-label="Break-even timeline">';
  const q=[{n:'Q1 · Jul–Sep',c:'#eef2ff',tc:'#475569'},{n:'Q2 · Oct–Dec (profit window)',c:'#fee2e2',tc:'#b91c1c'},{n:'Q3 · Jan–Mar',c:'#f1f5f9',tc:'#475569'},{n:'Q4 · Apr–Jun',c:'#f8fafc',tc:'#475569'}];
  q.forEach((qq,i)=>{s+=`<rect x="${x0+i*3*slot}" y="20" width="${3*slot}" height="30" fill="${qq.c}" rx="5"/>`;s+=`<text x="${x0+i*3*slot+1.5*slot}" y="40" text-anchor="middle" font-size="10.5" font-weight="700" fill="${qq.tc}">${qq.n}</text>`;});
  s+=`<line x1="${x0}" y1="${y}" x2="${x0+12*slot}" y2="${y}" stroke="#cbd5e1" stroke-width="1.5"/>`;
  M.forEach((m,i)=>{const px=x0+i*slot;s+=`<line x1="${px}" y1="${y-4}" x2="${px}" y2="${y}" stroke="#cbd5e1"/>`;s+=`<text x="${cx(i)}" y="${y+18}" text-anchor="middle" font-size="9.5" fill="#64748b">${m}</text>`;});
  const q2end=x0+6*slot;
  s+=`<line x1="${q2end}" y1="56" x2="${q2end}" y2="${y+8}" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<text x="${q2end}" y="68" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">31 Dec · Q2 ends</text>`;
  BE.forEach(b=>{
    const px=cx(b.i);
    s+=`<g class="mk" data-tip="${tips[b.k]}">`;
    s+=`<line x1="${px}" y1="56" x2="${px}" y2="${y}" stroke="${b.clr}" stroke-width="1.2" opacity=".5"/>`;
    s+=`<circle cx="${px}" cy="${y}" r="6.5" fill="${b.clr}" stroke="#fff" stroke-width="2"/>`;
    s+=`<text x="${px}" y="${b.up?y-18:y+38}" text-anchor="middle" font-size="10" font-weight="800" fill="${b.clr}">${b.n}</text>`;
    s+=`<text x="${px}" y="${b.up?y-7:y+50}" text-anchor="middle" font-size="9" fill="#64748b">${b.m}</text>`;
    s+=`</g>`;
  });
  s+='</svg>';
  return s;
}

  // info buttons: click to popout

        tip.textContent=btn.getAttribute('data-tip');
        tip.classList.add('show');
        const r=btn.getBoundingClientRect();
        tip.style.left='auto';
        tip.style.right=(window.innerWidth-r.right)+'px';
        tip.style.top=(r.bottom+10)+'px';
      }
    });
  });

  document.addEventListener('click',close);
}
